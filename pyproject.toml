[project]
name = "kws-accent-robustness"
version = "0.0.1"
description = "Measuring and reducing the accuracy gap of a keyword-spotting CNN on Serbian-accented speech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "librosa",
    "soundfile",
    "numpy",
    "pyyaml",
    "scikit-learn",
    "mlflow>=3.16.1",
]

[project.optional-dependencies]
# scripts/prepare_accented.py: decode phone/WhatsApp audio, optional Whisper check
accented = ["av", "faster-whisper"]
# scripts/export_onnx.py, scripts/benchmark_latency.py, serve/app.py and their tests
serve = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "uvicorn>=0.53.0",
]
